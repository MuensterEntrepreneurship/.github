name: publish-sciebo

# Spiegelt die in diesem Lauf gebauten .mcpb einer einzelnen Extension in den
# gemeinsamen sciebo-Ordner - für alle, die nicht über GitHub installieren.
# Wiederverwendbarer Workflow: ein aufrufendes Repo übergibt die gebauten
# Bundles als Artefakt aus demselben Lauf; dieser Job lädt sie herunter, prüft
# sie gegen den Slug und spielt sie per WebDAV nach sciebo. Er setzt release.yml
# nicht voraus: jeder Vorgänger-Job genügt, der ein Artefakt mit .mcpb ablegt,
# deren Dateinamen mit "<slug>-" beginnen. Anleitung: docs/publish-sciebo.md.
#
# Aufräumregel (die einzige): erst hochladen, danach den Ordner per PROPFIND
# lesen, und nur .mcpb löschen, die mit "<slug>-" beginnen und nicht gerade in
# diesem Lauf hochgeladen wurden. Dateien anderer Slugs werden nie angefasst -
# mehrere Repos teilen sich den Ordner, jedes räumt nur hinter sich selbst auf.
# Scheitert der PROPFIND, wird nichts gelöscht. Es gibt kein .version.json und
# keine VERSIONS.md mehr; die Version steht im Dateinamen.
#
# `secrets.SCIEBO_*` und `vars.SCIEBO_*` lösen sich immer gegen das AUFRUFENDE
# Repo auf, nie gegen dieses .github-Repo - jedes Extension-Repo braucht die
# zwei Secrets (SCIEBO_USER, SCIEBO_APP_PASSWORD) und die zwei Variablen
# (SCIEBO_BASE_URL = nur der Host, SCIEBO_FOLDER = Zielordner) selbst. Eine
# nicht gesetzte Variable expandiert zu "" statt zu scheitern; das fängt die
# Vorprüfung im ersten Schritt ab, statt in die Konto-Wurzel zu veröffentlichen.
#
# Namensregel (symmetrisch, wird unten geprüft): kein bekannter Slug darf
# Präfix eines anderen sein, in keiner der beiden Richtungen - das Slug-Präfix
# ist die einzige Grundlage, nach der ein Lauf entscheidet, welche Dateien er
# löschen darf.
#
# Das Skript liegt als scripts/publish_sciebo.py in diesem Repo und wird unten
# an genau der SHA nachgeladen, aus der dieser Workflow läuft (job.workflow_sha).
#
# Schreibzugriff auf dieses .github-Repo muss Owner-only bleiben: ein Lauf eines
# rufenden Repos läuft mit dessen Secrets. Aufrufer referenzieren deshalb den
# verschobenen Tag `v1`, nicht `main`; eine Änderung hier wird erst wirksam,
# wenn `v1` nachgezogen wird.

on:
  workflow_call:
    inputs:
      slug:
        description: "Kurzname = Präfix der Dateien, die dieser Lauf hochlädt und aufräumen darf. Aus needs.release.outputs.slug übernehmen."
        required: true
        type: string
      version:
        description: "Optional: Version ohne v - jede Datei muss dann auf -v<version>.mcpb enden (Plausibilitätsprüfung)"
        required: false
        type: string
        default: ""
      artifact:
        description: "Name des Artefakts mit den gebauten .mcpb"
        required: false
        type: string
        default: mcpb-bundles
    # Keine secrets: hier - der Aufrufer nutzt "secrets: inherit"; ob SCIEBO_USER
    # und SCIEBO_APP_PASSWORD tatsächlich gesetzt sind, prüft der erste Schritt.

# Kein Checkout, kein gh: der Job braucht am Repo gar nichts. Das Artefakt des
# eigenen Laufs wird über das Runtime-Token geladen, nicht über GITHUB_TOKEN.
permissions:
  contents: read

# Die Allowlist der Extensions, die in den gemeinsamen sciebo-Ordner
# veröffentlichen dürfen. Kommt eine fünfte Extension hinzu, wird sie hier
# eingetragen - sonst bricht ihr Aufruf im ersten Schritt ab. Kein Slug darf
# Präfix eines anderen sein (in keiner Richtung), weil das Slug-Präfix die
# einzige Grundlage ist, nach der ein Lauf entscheidet, welche Dateien er
# löschen darf.
env:
  KNOWN_SLUGS: "confluence github-access sciebo uni-mail"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      # Secrets werden hier nur als "gesetzt/nicht gesetzt" abgefragt, ihre
      # Werte landen erst im letzten Schritt in der Umgebung.
      - name: Slug, Allowlist und Konfiguration des Aufrufers prüfen
        env:
          SLUG: ${{ inputs.slug }}
          SCIEBO_BASE_URL: ${{ vars.SCIEBO_BASE_URL }}
          SCIEBO_FOLDER: ${{ vars.SCIEBO_FOLDER }}
          HAS_USER: ${{ secrets.SCIEBO_USER != '' }}
          HAS_PASSWORD: ${{ secrets.SCIEBO_APP_PASSWORD != '' }}
        run: |
          # 1. Slug-Syntax
          if ! [[ "$SLUG" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::Ungültiger slug '$SLUG' - erlaubt ist ^[a-z0-9]+(-[a-z0-9]+)*\$"
            exit 1
          fi

          # 2. Slug muss in der Allowlist stehen
          KNOWN=false
          for S in $KNOWN_SLUGS; do
            [ "$S" = "$SLUG" ] && KNOWN=true
          done
          if [ "$KNOWN" != "true" ]; then
            echo "::error::Slug '$SLUG' steht nicht in KNOWN_SLUGS ('$KNOWN_SLUGS') - neue Extension zuerst dort eintragen"
            exit 1
          fi

          # 3. Namensregel paarweise über die gesamte Allowlist prüfen: kein
          #    Slug darf Präfix eines anderen sein, in keiner Richtung.
          for A in $KNOWN_SLUGS; do
            for B in $KNOWN_SLUGS; do
              if [ "$A" != "$B" ]; then
                case "$B" in
                  "$A"-*)
                    echo "::error::Namensregel verletzt: '$A' ist Präfix von '$B'"
                    exit 1
                    ;;
                esac
              fi
            done
          done

          # 4. Die übrigen bekannten Slugs für die Aufräumregel im letzten
          #    Schritt merken - der eigene Slug zählt nicht dazu.
          OTHER=""
          for S in $KNOWN_SLUGS; do
            [ "$S" = "$SLUG" ] || OTHER="$OTHER $S"
          done
          echo "OTHER_SLUGS=${OTHER# }" >> "$GITHUB_ENV"

          # 5. Secrets und Variablen des Aufrufers - Secret-Werte bleiben außen vor
          MISSING=""
          [ "$HAS_USER" = "true" ]     || MISSING="$MISSING SCIEBO_USER(secret)"
          [ "$HAS_PASSWORD" = "true" ] || MISSING="$MISSING SCIEBO_APP_PASSWORD(secret)"
          [ -n "$SCIEBO_BASE_URL" ]    || MISSING="$MISSING SCIEBO_BASE_URL(variable)"
          [ -n "$SCIEBO_FOLDER" ]      || MISSING="$MISSING SCIEBO_FOLDER(variable)"
          if [ -n "$MISSING" ]; then
            echo "::error::Im Repo $GITHUB_REPOSITORY nicht gesetzt:$MISSING - Settings > Secrets and variables > Actions"
            exit 1
          fi

          # 6. Ausgabe
          echo "Slug: $SLUG"
          echo "Andere bekannte Slugs: ${OTHER# }"
          echo "Basis: $SCIEBO_BASE_URL"
          echo "Zielordner: $SCIEBO_FOLDER"

      - name: Gebaute Bundles aus dem Artefakt laden
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/bundles

      # Vorprüfung vor dem ersten Byte nach sciebo: jede Datei muss "<slug>-"
      # tragen, sonst passt das Artefakt nicht zum Slug - und die Aufräumregel
      # im Skript würde auf dem falschen Präfix arbeiten. publish_sciebo.py
      # prüft dasselbe noch einmal unmittelbar vor jedem DELETE; doppelt ist
      # hier Absicht.
      - name: Bundle-Dateinamen gegen Slug prüfen
        env:
          SLUG: ${{ inputs.slug }}
          VERSION: ${{ inputs.version }}
        run: |
          shopt -s nullglob
          FILES=("$RUNNER_TEMP"/bundles/*.mcpb)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::Keine .mcpb im Artefakt"
            exit 1
          fi
          for F in "${FILES[@]}"; do
            NAME=$(basename "$F")
            case "$NAME" in
              "$SLUG"-*) ;;
              *) echo "::error::$NAME beginnt nicht mit '$SLUG-' - Artefakt und Slug passen nicht zusammen"; exit 1 ;;
            esac
            if [ -n "$VERSION" ]; then
              case "$NAME" in
                *"-v$VERSION.mcpb") ;;
                *) echo "::error::$NAME endet nicht auf -v$VERSION.mcpb"; exit 1 ;;
              esac
            fi
            echo "OK: $NAME"
          done

      # Das Skript liegt als scripts/publish_sciebo.py in diesem Repo und wird hier
      # nachgeladen. Ein wiederverwendbarer Workflow kann sein eigenes Repo nicht per
      # actions/checkout auschecken - Checkout und `github.*` gehören dem Aufrufer -,
      # kennt aber über den `job`-Kontext seine eigene Herkunft: job.workflow_repository
      # und job.workflow_sha zeigen auf die Datei, die diesen Job definiert, also auf
      # dieses .github-Repo an genau dem Commit, mit dem der Aufrufer den Workflow
      # aufgerufen hat. Workflow-Datei und Skript stammen damit immer aus demselben
      # Commit; eine Drift zwischen beiden ist konstruktiv ausgeschlossen.
      #
      # Ziel ist $RUNNER_TEMP, nicht das Arbeitsverzeichnis: in diesem Job gibt es
      # zwar keinen Checkout, aber dieselbe Regel gilt im Release-Workflow, wo der
      # Arbeitsbaum das Bundle-Verzeichnis ist.
      #
      # Der Vertrag des Skripts steht in seinem Docstring: Umgebung SLUG, OTHER_SLUGS,
      # SCIEBO_BASE_URL, SCIEBO_FOLDER, SCIEBO_USER, SCIEBO_APP_PASSWORD; argv[1] =
      # Verzeichnis mit den .mcpb-Dateien; kein MKCOL, der Zielordner muss bereits
      # existieren; scheitert der PROPFIND, wird nichts gelöscht und das Skript
      # beendet sich mit Exit-Code 1.
      - name: Sciebo-Skript aus diesem Repo holen
        env:
          WF_REPO: ${{ job.workflow_repository }}
          WF_SHA: ${{ job.workflow_sha }}
          # Der Token des AUFRUFERS. Er braucht keinen Zugriff auf dieses Repo, das
          # öffentlich ist; authentifiziert wird nur, um das anonyme Rate Limit der
          # API (60/h je Runner-IP) nicht zu treffen.
          GH_TOKEN: ${{ github.token }}
        run: |
          # Ein Tippfehler im Kontextnamen ergibt bei GitHub keinen Fehler, sondern
          # den leeren String. Das hier scheitert dann laut, statt eine 404 vom
          # Tarball-Endpunkt zu erklären.
          [ -n "$WF_REPO" ] || { echo "::error::job.workflow_repository ist leer"; exit 1; }
          [[ "$WF_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::job.workflow_sha ist keine SHA: '$WF_SHA'"; exit 1; }
          DIR="$RUNNER_TEMP/dotgithub"
          mkdir -p "$DIR"
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$WF_REPO/tarball/$WF_SHA" \
            | tar -xz -C "$DIR" --strip-components=1 --wildcards '*/scripts/publish_sciebo.py'
          SCRIPT="$DIR/scripts/publish_sciebo.py"
          [ -f "$SCRIPT" ] || { echo "::error::scripts/publish_sciebo.py nicht im Tarball von $WF_REPO@$WF_SHA"; exit 1; }
          python3 -m py_compile "$SCRIPT"
          echo "PUBLISH_SCIEBO_PY=$SCRIPT" >> "$GITHUB_ENV"
          echo "Skript: $WF_REPO@$WF_SHA:scripts/publish_sciebo.py"
          echo "- Skript: \`$WF_REPO@$WF_SHA\`" >> "$GITHUB_STEP_SUMMARY"

      # Beweist bei jedem Lauf, dass das nachgeladene Skript intakt ist, bevor
      # überhaupt Zugangsdaten in die Umgebung gelangen. Bewusst ohne Secrets.
      # Dieselbe Prüfung läuft in der CI dieses Repos bei jedem Push und PR.
      - name: Selbsttest der Schutzlogik (offline)
        run: python3 "$PUBLISH_SCIEBO_PY" --self-test

      - name: Upload nach sciebo
        env:
          SLUG: ${{ inputs.slug }}
          # OTHER_SLUGS kommt bereits aus $GITHUB_ENV des ersten Schritts und
          # muss hier nicht erneut zugeordnet werden.
          SCIEBO_BASE_URL: ${{ vars.SCIEBO_BASE_URL }}
          SCIEBO_FOLDER: ${{ vars.SCIEBO_FOLDER }}
          SCIEBO_USER: ${{ secrets.SCIEBO_USER }}
          SCIEBO_APP_PASSWORD: ${{ secrets.SCIEBO_APP_PASSWORD }}
        run: python3 "$PUBLISH_SCIEBO_PY" "$RUNNER_TEMP/bundles"
