name: publish-sciebo

# Spiegelt die Dateien eines Artefakts in einen sciebo-Ordner - für alle, die
# nicht über GitHub installieren. Wiederverwendbarer Workflow: ein aufrufendes
# Repo legt im selben Lauf ein Artefakt ab, dieser Job lädt es herunter und
# schreibt jede Datei per WebDAV in den Zielordner.
#
# Der ganze Vertrag, und er ist absichtlich so kurz:
#
#   Jede Datei aus dem Artefakt landet unter ihrem eigenen Namen im Zielordner
#   und ersetzt dort die gleichnamige Datei. Es wird nie etwas gelöscht, nie ein
#   Ordner angelegt und nie ein Dateiname ausgewertet.
#
# Daraus folgt der Rest. Weil nichts gelöscht wird, gibt es keine Eigentumsfrage
# und damit keinen Slug, keine Allowlist, keine Präfixregel, keine Endungsliste
# und keine Versionsgrammatik. Welche Dateien entstehen, entscheidet allein der
# Aufrufer über die Namen im Artefakt; .mcpb, .plugin, ein Skill-Zip oder eine
# PDF sind für diesen Job dasselbe. Der Preis dafür steht in docs/publish-sciebo.md:
# eine zurückgezogene Datei bleibt liegen, und der Lauf kann sie nicht erkennen -
# mehrere Repos teilen sich einen Ordner, und die aktuelle Datei eines anderen
# Repos sieht von hier aus aus wie eine eigene Karteileiche. Der Job listet den
# Ordner deshalb nur auf und urteilt nicht.
#
# Ersetzt wird in zwei Schritten, damit der Zielname nie eine halbe Datei trägt:
# PUT auf ".<name>.part", Bytes zurücklesen und vergleichen, dann MOVE mit
# Overwrite auf "<name>". Scheitert einer der Schritte, bleibt die bisherige
# Datei unberührt stehen.
#
# `secrets.SCIEBO_*` und `vars.SCIEBO_*` lösen sich immer gegen das AUFRUFENDE
# Repo auf, nie gegen dieses .github-Repo - jedes Repo braucht die zwei Secrets
# (SCIEBO_USER, SCIEBO_APP_PASSWORD) und die zwei Variablen (SCIEBO_BASE_URL =
# nur der Host, SCIEBO_FOLDER = Zielordner) selbst. Eine nicht gesetzte Variable
# expandiert zu "" statt zu scheitern; das fängt die Vorprüfung im ersten Schritt
# ab, statt in die Konto-Wurzel zu veröffentlichen.
#
# In SCIEBO_FOLDER darf niemand sonst Dateien ablegen: gelöscht wird zwar nie,
# aber ein gleichnamiger Upload überschreibt. Ein reiner Verteilordner erfüllt
# das, ein gemischter Arbeitsordner nicht.
#
# Das Skript liegt als scripts/publish_sciebo.py in diesem Repo und wird unten
# an genau der SHA nachgeladen, aus der dieser Workflow läuft (job.workflow_sha).
#
# Schreibzugriff auf dieses .github-Repo muss Owner-only bleiben: ein Lauf eines
# rufenden Repos läuft mit dessen Secrets.

on:
  workflow_call:
    inputs:
      artifact:
        description: "Name des Artefakts, dessen Dateien gespiegelt werden. Die Dateinamen darin sind die Namen in sciebo."
        required: false
        type: string
        default: mcpb-latest
    # Keine secrets: hier - der Aufrufer nutzt "secrets: inherit"; ob SCIEBO_USER
    # und SCIEBO_APP_PASSWORD tatsächlich gesetzt sind, prüft der erste Schritt.

# Kein Checkout, kein gh: der Job braucht am Repo gar nichts. Das Artefakt des
# eigenen Laufs wird über das Runtime-Token geladen, nicht über GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      # Secrets werden hier nur als "gesetzt/nicht gesetzt" abgefragt, ihre
      # Werte landen erst im letzten Schritt in der Umgebung.
      - name: Konfiguration des Aufrufers prüfen
        env:
          SCIEBO_BASE_URL: ${{ vars.SCIEBO_BASE_URL }}
          SCIEBO_FOLDER: ${{ vars.SCIEBO_FOLDER }}
          HAS_USER: ${{ secrets.SCIEBO_USER != '' }}
          HAS_PASSWORD: ${{ secrets.SCIEBO_APP_PASSWORD != '' }}
        run: |
          MISSING=""
          [ "$HAS_USER" = "true" ]     || MISSING="$MISSING SCIEBO_USER(secret)"
          [ "$HAS_PASSWORD" = "true" ] || MISSING="$MISSING SCIEBO_APP_PASSWORD(secret)"
          [ -n "$SCIEBO_BASE_URL" ]    || MISSING="$MISSING SCIEBO_BASE_URL(variable)"
          [ -n "$SCIEBO_FOLDER" ]      || MISSING="$MISSING SCIEBO_FOLDER(variable)"
          if [ -n "$MISSING" ]; then
            echo "::error::Im Repo $GITHUB_REPOSITORY nicht gesetzt:$MISSING - Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "Basis: $SCIEBO_BASE_URL"
          echo "Zielordner: $SCIEBO_FOLDER"

      - name: Dateien aus dem Artefakt laden
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/publish

      # Nur die grobe Form, bevor Zugangsdaten in die Umgebung gelangen: gibt es
      # überhaupt Dateien, und ist keine davon ein Verzeichnis. Die Namen selbst
      # prüft publish_sciebo.py, und zwar vor dem ersten Socket.
      - name: Artefakt sichten
        run: |
          DIR="$RUNNER_TEMP/publish"
          shopt -s nullglob dotglob
          ENTRIES=("$DIR"/*)
          if [ "${#ENTRIES[@]}" -eq 0 ]; then
            echo "::error::Das Artefakt '${{ inputs.artifact }}' enthält keine Dateien"
            exit 1
          fi
          for E in "${ENTRIES[@]}"; do
            if [ -d "$E" ]; then
              echo "::error::$(basename "$E") ist ein Verzeichnis - dieser Spiegel kennt nur Dateien, flach. Ordner gehören vom Aufrufer gepackt."
              exit 1
            fi
            echo "$(basename "$E")  $(stat -c%s "$E") Byte"
          done

      # Das Skript liegt als scripts/publish_sciebo.py in diesem Repo und wird hier
      # nachgeladen. Ein wiederverwendbarer Workflow kann sein eigenes Repo nicht per
      # actions/checkout auschecken - Checkout und `github.*` gehören dem Aufrufer -,
      # kennt aber über den `job`-Kontext seine eigene Herkunft: job.workflow_repository
      # und job.workflow_sha zeigen auf die Datei, die diesen Job definiert, also auf
      # dieses .github-Repo an genau dem Commit, mit dem der Aufrufer den Workflow
      # aufgerufen hat. Workflow-Datei und Skript stammen damit immer aus demselben
      # Commit; eine Drift zwischen beiden ist konstruktiv ausgeschlossen.
      #
      # Der Vertrag des Skripts steht in seinem Docstring: Umgebung SCIEBO_BASE_URL,
      # SCIEBO_FOLDER, SCIEBO_USER, SCIEBO_APP_PASSWORD; argv[1] = Verzeichnis mit den
      # Dateien; kein MKCOL, der Zielordner muss bereits existieren; kein DELETE, nie.
      - name: Sciebo-Skript aus diesem Repo holen
        env:
          WF_REPO: ${{ job.workflow_repository }}
          WF_SHA: ${{ job.workflow_sha }}
          # Der Token des AUFRUFERS. Er braucht keinen Zugriff auf dieses Repo, das
          # öffentlich ist; authentifiziert wird nur, um das anonyme Rate Limit der
          # API (60/h je Runner-IP) nicht zu treffen.
          GH_TOKEN: ${{ github.token }}
        run: |
          # Ein Tippfehler im Kontextnamen ergibt bei GitHub keinen Fehler, sondern
          # den leeren String. Das hier scheitert dann laut, statt eine 404 vom
          # Tarball-Endpunkt zu erklären.
          [ -n "$WF_REPO" ] || { echo "::error::job.workflow_repository ist leer"; exit 1; }
          [[ "$WF_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::job.workflow_sha ist keine SHA: '$WF_SHA'"; exit 1; }
          DIR="$RUNNER_TEMP/dotgithub"
          mkdir -p "$DIR"
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$WF_REPO/tarball/$WF_SHA" \
            | tar -xz -C "$DIR" --strip-components=1 --wildcards '*/scripts/publish_sciebo.py'
          SCRIPT="$DIR/scripts/publish_sciebo.py"
          [ -f "$SCRIPT" ] || { echo "::error::scripts/publish_sciebo.py nicht im Tarball von $WF_REPO@$WF_SHA"; exit 1; }
          python3 -m py_compile "$SCRIPT"
          echo "PUBLISH_SCIEBO_PY=$SCRIPT" >> "$GITHUB_ENV"
          echo "Skript: $WF_REPO@$WF_SHA:scripts/publish_sciebo.py"
          echo "- Skript: \`$WF_REPO@$WF_SHA\`" >> "$GITHUB_STEP_SUMMARY"

      # Beweist bei jedem Lauf, dass das nachgeladene Skript intakt ist, bevor
      # überhaupt Zugangsdaten in die Umgebung gelangen. Der wichtigste Teil davon
      # ist die Zusage, die dieser Job gibt: das Skript kennt nur PUT, GET, PROPFIND
      # und MOVE, und der Guard dafür greift vor dem Socket. Bewusst ohne Secrets.
      # Dieselbe Prüfung läuft in der CI dieses Repos bei jedem Push und PR.
      - name: Selbsttest der Schutzlogik (offline)
        run: python3 "$PUBLISH_SCIEBO_PY" --self-test

      - name: Spiegeln nach sciebo
        env:
          SCIEBO_BASE_URL: ${{ vars.SCIEBO_BASE_URL }}
          SCIEBO_FOLDER: ${{ vars.SCIEBO_FOLDER }}
          SCIEBO_USER: ${{ secrets.SCIEBO_USER }}
          SCIEBO_APP_PASSWORD: ${{ secrets.SCIEBO_APP_PASSWORD }}
        run: python3 "$PUBLISH_SCIEBO_PY" "$RUNNER_TEMP/publish"
